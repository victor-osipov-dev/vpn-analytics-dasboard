[package]
name = "netscope-desktop"
version = "0.1.0"
edition = "2021"
description = "NetScope desktop shell (Tauri 2)"
build = "build.rs"
default-run = "netscope-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
netscope-core = { path = "../../../crates/netscope-core" }
netscope-network = { path = "../../../crates/netscope-network" }
netscope-routes = { path = "../../../crates/netscope-routes" }
netscope-probes = { path = "../../../crates/netscope-probes" }
netscope-analyzer = { path = "../../../crates/netscope-analyzer" }
netscope-scheduler = { path = "../../../crates/netscope-scheduler" }
netscope-storage = { path = "../../../crates/netscope-storage" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["windows-native"] }
