[workspace]
resolver = "2"
members = [
    "crates/netscope-core",
    "crates/netscope-network",
    "crates/netscope-routes",
    "crates/netscope-probes",
    "crates/netscope-analyzer",
    "crates/netscope-scheduler",
    "crates/netscope-storage",
    "crates/netscope-platform-windows",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
