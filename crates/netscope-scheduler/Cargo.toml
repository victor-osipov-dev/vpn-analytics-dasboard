[package]
name = "netscope-scheduler"
version.workspace = true
edition.workspace = true

[dependencies]
netscope-core = { path = "../netscope-core" }
netscope-network = { path = "../netscope-network" }
netscope-routes = { path = "../netscope-routes" }
netscope-probes = { path = "../netscope-probes" }
netscope-storage = { path = "../netscope-storage" }
netscope-analyzer = { path = "../netscope-analyzer" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

[[bin]]
name = "netscope-smoke"
path = "src/bin/smoke.rs"

[dependencies.keyring]
version = "3"
optional = true
features = ["windows-native"]

[features]
default = ["keyring-secure"]
keyring-secure = ["dep:keyring"]
